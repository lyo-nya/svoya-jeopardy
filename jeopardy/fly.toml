# fly.toml - Fly.io configuration for New Year Jeopardy Party Game
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = "jeopardy-game"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  FLASK_ENV = "production"
  # FLY_VOLUME_PATH is set automatically when a volume is mounted

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "jeopardy_data"
  destination = "/data"
