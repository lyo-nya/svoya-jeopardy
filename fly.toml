# fly.toml app configuration file generated for svoya-jeopardy on 2025-12-22T11:43:32+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'svoya-jeopardy'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  FLASK_ENV = 'production'

[[mounts]]
  source = 'jeopardy_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
