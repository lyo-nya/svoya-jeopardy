<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Своя Jeopardy! - Загрузка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            text-align: center;
        }
        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(212, 175, 55, 0.2);
            border-top-color: #d4af37;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 24px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-text {
            font-size: 1.5em;
            color: #d4af37;
            font-weight: 700;
            font-family: 'PT Serif', Georgia, serif;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }
        .loading-subtitle {
            font-size: 0.9em;
            color: #a8b4c4;
            margin-top: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .error-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            text-align: center;
            padding: 20px;
        }
        .error-text {
            color: #c41e3a;
            font-size: 1.1em;
            margin-bottom: 20px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .error-details {
            background: rgba(26, 58, 106, 0.3);
            border: 1px solid #1a3a6a;
            padding: 15px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            max-width: 100%;
            overflow-wrap: break-word;
            color: #a8b4c4;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="loading" class="loading-container">
            <div class="loading-spinner"></div>
            <div class="loading-text">Своя Jeopardy!</div>
            <div class="loading-subtitle">Загрузка игры...</div>
        </div>
        
        <div id="error" class="error-container">
            <div class="error-text">
                Не удалось подключиться к Telegram
            </div>
            <div class="error-details" id="error-details">
                Пожалуйста, откройте это приложение из Telegram.
            </div>
        </div>
    </div>

    <script>
        (function() {
            // Redirect loop protection
            var redirectKey = "jeopardy_redirect_count";
            var redirectCount = parseInt(sessionStorage.getItem(redirectKey) || "0", 10);
            var lastRedirectTime = parseInt(sessionStorage.getItem(redirectKey + "_time") || "0", 10);
            var now = Date.now();
            
            // Reset counter if more than 5 seconds have passed
            if (now - lastRedirectTime > 5000) {
                redirectCount = 0;
            }
            
            // Detect redirect loop (more than 3 redirects in 5 seconds)
            if (redirectCount >= 3) {
                sessionStorage.removeItem(redirectKey);
                sessionStorage.removeItem(redirectKey + "_time");
                showError(
                    "Обнаружена ошибка перенаправления. Возможные причины:\n\n" +
                    "1. Проблема с конфигурацией бота\n" +
                    "2. Ошибка авторизации Telegram\n\n" +
                    "Попробуйте закрыть и открыть приложение заново."
                );
                return;
            }
            
            // Initialize Telegram WebApp
            var tg = window.Telegram && window.Telegram.WebApp;
            
            if (!tg) {
                showError("Telegram WebApp SDK недоступен. Пожалуйста, откройте приложение из Telegram.");
                return;
            }
            
            // Signal to Telegram that we're ready (with error handling)
            try {
                tg.ready();
                tg.expand();
            } catch (e) {
                console.error("Error initializing Telegram WebApp:", e);
                showError("Ошибка инициализации Telegram WebApp: " + e.message);
                return;
            }
            
            // Get init data from the SDK
            var initData = tg.initData;
            
            console.log("Telegram WebApp initialized");
            console.log("initData present:", !!initData);
            console.log("initData length:", initData ? initData.length : 0);
            
            if (!initData) {
                showError(
                    "Данные авторизации не получены от Telegram. " +
                    "Это приложение нужно открывать из чата Telegram через кнопку WebApp.\n\n" +
                    "Отладочная информация:\n" +
                    "- Платформа: " + (tg.platform || "неизвестно") + "\n" +
                    "- Версия: " + (tg.version || "неизвестно")
                );
                return;
            }
            
            // Update redirect counter before redirecting
            sessionStorage.setItem(redirectKey, String(redirectCount + 1));
            sessionStorage.setItem(redirectKey + "_time", String(now));
            
            // Redirect to the authenticated app route with init_data
            var appUrl = "{{ url_for('main.index') }}";
            var separator = appUrl.includes("?") ? "&" : "?";
            var redirectUrl = appUrl + separator + "init_data=" + encodeURIComponent(initData);
            
            console.log("Redirecting to:", redirectUrl.substring(0, 100) + "...");
            
            // Small delay to ensure Telegram WebApp is fully ready
            setTimeout(function() {
                window.location.href = redirectUrl;
            }, 100);
        })();
        
        function showError(message) {
            document.getElementById("loading").style.display = "none";
            document.getElementById("error").style.display = "flex";
            document.getElementById("error-details").textContent = message;
        }
    </script>
</body>
</html>
