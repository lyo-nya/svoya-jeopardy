{% extends "base.html" %}

{% block title %}Scores - New Year Jeopardy{% endblock %}

{% block content %}
<h1>🎆 Scores 🎆</h1>

<div class="standings">
    {% for p in players %}
        <div class="standing-row">
            <span>{{ p.name }}</span>
            <span>{{ p.total_score }} pts</span>
        </div>
    {% endfor %}
</div>

<a href="{{ url_for('game.game_board') }}" class="btn">Back to Game</a>
{% endblock %}
