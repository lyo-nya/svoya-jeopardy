<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>New Year Jeopardy</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            text-align: center;
        }
        .loading h1 {
            margin-bottom: 1rem;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 1rem 0;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            color: #e74c3c;
            padding: 1rem;
            background: #fdeaea;
            border-radius: 8px;
            margin-top: 1rem;
            display: none;
        }
        .debug-info {
            margin-top: 2rem;
            padding: 1rem;
            background: #f5f5f5;
            border-radius: 8px;
            font-size: 0.8rem;
            text-align: left;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="loading">
            <h1>🎆 New Year Jeopardy 🎆</h1>
            <div class="spinner"></div>
            <p id="status">Loading...</p>
            
            <div class="error" id="error">
                <p><strong>Unable to authenticate with Telegram</strong></p>
                <p>Please make sure you're opening this app from Telegram.</p>
                <p id="error-details"></p>
            </div>
            
            <div class="debug-info" id="debug">
                <p><strong>Debug Info:</strong></p>
                <pre id="debug-content"></pre>
            </div>
        </div>
    </div>
    
    <script>
        (function() {
            const statusEl = document.getElementById('status');
            const errorEl = document.getElementById('error');
            const errorDetailsEl = document.getElementById('error-details');
            const debugEl = document.getElementById('debug');
            const debugContentEl = document.getElementById('debug-content');
            
            // Check if Telegram WebApp is available
            if (!window.Telegram || !window.Telegram.WebApp) {
                statusEl.style.display = 'none';
                errorEl.style.display = 'block';
                errorDetailsEl.textContent = 'Telegram WebApp SDK not available. Please open this app from Telegram.';
                return;
            }
            
            const tg = window.Telegram.WebApp;
            
            // Initialize WebApp
            tg.ready();
            tg.expand();
            
            // Get init data
            const initData = tg.initData;
            
            // Debug info
            const debugInfo = {
                initDataLength: initData ? initData.length : 0,
                hasInitData: !!initData,
                platform: tg.platform,
                version: tg.version,
                colorScheme: tg.colorScheme,
            };
            
            if (!initData) {
                statusEl.style.display = 'none';
                errorEl.style.display = 'block';
                errorDetailsEl.textContent = 'No authentication data received from Telegram.';
                
                // Show debug info
                debugEl.style.display = 'block';
                debugContentEl.textContent = JSON.stringify(debugInfo, null, 2);
                return;
            }
            
            statusEl.textContent = 'Authenticating...';
            
            // Redirect to the authenticated start page with init_data
            const startUrl = '/start?init_data=' + encodeURIComponent(initData);
            window.location.href = startUrl;
        })();
    </script>
</body>
</html>
